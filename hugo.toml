baseURL = "https://matheus-amaral06.github.io/"
# Change the default theme to be use when building the site with Hugo
theme = "LoveIt"
defaultContentLanguage = "pt-br"
languageCode = "pt-br"
# website title
title = "My New Hugo Site"



[taxonomies]
# language code ["en", "zh-CN", "fr", "pl", ...]

# language name ["English", "简体中文", "Français", "Polski", ...]
# Menu config

[menu]

    [[menu.main]]
      weight = 1
      identifier = "posts"
      name = "Posts"
      url = "/posts/"       # ← sem prefixo
    [[menu.main]]
      weight = 2
      identifier = "about"
      name = "Sobre"
      url = "/sobre/"       # ← sem prefixo

[params]
  # site default theme ["auto", "light", "dark"]
  defaultTheme = "light"
  title = "Amaral Cyber Journal"
  images = ["/static/images/avatar.png"]

  [params.author]
    name = "Matheus Amaral Moraes"
    email = "matheusamaralmoraes06@gmail.com"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"

    [params.header.title]
        name = "Amaral Cyber Journal"
        typeit = true

  [params.home]
    rss = 10
    [params.home.profile]
        enable = true
        gravatarEmail = ""
        avatarURL = "/images/avatar.png"
        title = ""
        subtitle = ""
        social = true

  [params.social]
    GitHub = "Matheus-Amaral06"
    Linkedin = "matheus-amaral-moraes"
    Email = "matheusamaralmoraes06@gmail.com"


[markup]
  [markup.highlight]
    noClasses = false

[caches]
    [caches.images]
        dir = ':cacheDir/images'


